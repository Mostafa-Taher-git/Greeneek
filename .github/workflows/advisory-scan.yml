name: Advisory scan

# Lockfile advisories: scheduled weekly and whenever a pull request touches
# the lockfile or any manifest. `pnpm audit --audit-level=high` fails loud on
# high/critical advisories (no continue-on-error): a known advisory must be
# triaged or the dependency bumped, never ignored.
on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main, master]
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'packages/**/package.json'
      - 'apps/**/package.json'
      - 'vendor/**/package.json'
  push:
    branches: [main, master]
    paths:
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
