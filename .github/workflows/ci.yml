name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Gitleaks scans the push range (base^..head); a shallow checkout
          # lacks the base commit and fails the scan without checking anything.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Generated artifacts are current
        run: pnpm run verify-generated-artifacts
      - run: pnpm test -- --coverage --reporter=verbose
        env:
          CI: true
      - run: pnpm build
      - name: Typecheck the landing app
        run: pnpm --filter @greeneek/landing run typecheck
      - name: Build the landing app
        run: pnpm --filter @greeneek/landing run build
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Brand sweep
        run: node scripts/verify-brand-sweep.mjs
