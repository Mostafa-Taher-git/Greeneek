name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Gitleaks scans the push range (base^..head); a shallow checkout
          # lacks the base commit and fails the scan without checking anything.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Generated artifacts are current
        run: pnpm run verify-generated-artifacts
      - run: pnpm test -- --coverage --reporter=verbose
        env:
          CI: true
      - run: pnpm build
      - name: Typecheck the landing app
        run: pnpm --filter @greeneek/landing run typecheck
      - name: Build the landing app
        run: pnpm --filter @greeneek/landing run build
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Brand sweep
        run: node scripts/verify-brand-sweep.mjs

  repository:
    # The release-verification layers the `ci` job never ran: clone detection,
    # keyless recorded-session replay, and the hygiene aggregate. A parallel
    # job keeps the push wall clock inside the release gate's 1800s
    # CI-completion wait instead of extending the `ci` job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run duplication
      # Headless and Web profile subprocesses resolve `@greeneek/gnk-*/typert`
      # through package exports into built lib/typert.host.js, so the build must
      # precede replay. The built-invariants hygiene gate also needs these
      # artifacts.
      - run: pnpm build
      # Replay is the read-only tier: CI never writes committed outputs.
      - run: pnpm run test:snapshot
        env:
          GNK_SNAPSHOT: replay
      - run: pnpm run hygiene

  windows-shell:
    # The pwsh terminal lane is the only proof of the Windows shell path, so CI
    # load never skips it (the Linux job runs it too wherever pwsh resolves).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/terminal/terminal-bash

  consumers:
    # The consumer verification matrix: one aggregate that runs the lanes a
    # release claim depends on — expected-output processes, the browser snapshot
    # suite, the documentation typecheck, and every built-artifact smoke. It is a
    # separate job so its wall clock never extends the `ci` job, and the release
    # gate's workflow-run success still requires this job green.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci:consumers
        env:
          CI: true
          GNK_SNAPSHOT: replay
