name: Desktop release — Windows

on:
  push:
    tags:
      - 'desktop-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib:host
      - run: pnpm build:lib:client
      - run: pnpm build:web
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        run: node apps/desktop/scripts/stamp-version.mjs "${{ github.ref_name }}"
      - run: pnpm --filter @greeneek/desktop run dist:win
      - name: Assert updater channel files
        run: |
          ls apps/desktop/.staging/app/dist/latest*.yml
          ls apps/desktop/.staging/app/dist/*.blockmap
        shell: bash
      - run: node apps/desktop/scripts/prepare-release-assets.mjs --dist apps/desktop/.staging/app/dist
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        run: node apps/desktop/scripts/prepare-release-assets.mjs --dist apps/desktop/.staging/app/dist --tag "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-artifacts
          path: |
            apps/desktop/.staging/app/dist/*.exe
            apps/desktop/.staging/app/dist/*.zip
            apps/desktop/.staging/app/dist/*.yml
            apps/desktop/.staging/app/dist/*.blockmap
            apps/desktop/.staging/app/dist/Greeneek-Desktop-latest-*
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            apps/desktop/.staging/app/dist/*.exe
            apps/desktop/.staging/app/dist/*.zip
            apps/desktop/.staging/app/dist/*.yml
            apps/desktop/.staging/app/dist/*.blockmap
            apps/desktop/.staging/app/dist/Greeneek-Desktop-latest-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
