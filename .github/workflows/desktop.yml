name: Desktop release

on:
  push:
    tags:
      - 'desktop-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib:host
      - run: pnpm build:lib:client
      - run: pnpm build:web
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        run: node apps/desktop/scripts/stamp-version.mjs "${{ github.ref_name }}"
      - run: pnpm --filter @greeneek/desktop run dist:linux
      - run: node apps/desktop/scripts/prepare-release-assets.mjs --dist apps/desktop/.staging/app/dist
      - name: Assert updater channel files
        run: |
          ls apps/desktop/.staging/app/dist/latest*.yml
          ls apps/desktop/.staging/app/dist/*.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-artifacts
          path: |
            apps/desktop/.staging/app/dist/*.AppImage
            apps/desktop/.staging/app/dist/*.deb
            apps/desktop/.staging/app/dist/*.zsync
            apps/desktop/.staging/app/dist/*.yml
            apps/desktop/.staging/app/dist/*.blockmap
            apps/desktop/.staging/app/dist/Greeneek-Desktop-latest-*
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        uses: softprops/action-gh-release@v2
        with:
          # v0.2.0 reliability pass: .deb only. AppImage, zsync, channel
          # files, and latest-aliases rejoin the upload list once the full
          # matrix is declared reliable.
          name: v0.2.0
          files: |
            apps/desktop/.staging/app/dist/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
