name: Desktop release

on:
  push:
    tags:
      - 'desktop-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib:host
      - run: pnpm build:lib:client
      - run: pnpm build:web
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#desktop-v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" apps/desktop/package.json
          cat apps/desktop/package.json | grep version
      - run: pnpm --filter @greeneek/desktop run dist:linux
      - name: Drop builder diagnostics from the release set
        run: rm -f apps/desktop/.staging/app/dist/builder-debug.yml apps/desktop/.staging/app/dist/builder-effective-config.yaml
      - name: Build AppImage zsync metadata
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsync
          DIST=apps/desktop/.staging/app/dist
          APPIMAGE=$(ls "$DIST"/Greeneek-Desktop-*-linux-x86_64.AppImage | head -1)
          FILE=$(basename "$APPIMAGE")
          if [[ "${{ github.ref_name }}" == desktop-* ]]; then REF="${{ github.ref_name }}"; else REF="latest"; fi
          if [[ "$REF" == "latest" ]]; then URL="https://github.com/Mostafa-Taher-git/Greeneek/releases/latest/download/$FILE";
          else URL="https://github.com/Mostafa-Taher-git/Greeneek/releases/download/$REF/$FILE"; fi
          zsyncmake -u "$URL" -o "$DIST/$FILE.zsync" "$APPIMAGE"
          ls "$DIST"/*.zsync
      - run: node apps/desktop/scripts/prepare-release-assets.mjs --dist .staging/app/dist
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        run: node apps/desktop/scripts/prepare-release-assets.mjs --dist .staging/app/dist --tag "${{ github.ref_name }}"
      - name: Assert updater channel files
        run: |
          ls apps/desktop/.staging/app/dist/latest*.yml
          ls apps/desktop/.staging/app/dist/*.AppImage
          ls apps/desktop/.staging/app/dist/*.zsync
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-artifacts
          path: |
            apps/desktop/.staging/app/dist/*.deb
            apps/desktop/.staging/app/dist/*.AppImage
            apps/desktop/.staging/app/dist/*.zsync
            apps/desktop/.staging/app/dist/latest*.yml
            apps/desktop/.staging/app/dist/*.blockmap
            apps/desktop/.staging/app/dist/Greeneek-Desktop-latest-*
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/desktop-')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            apps/desktop/.staging/app/dist/*.deb
            apps/desktop/.staging/app/dist/*.AppImage
            apps/desktop/.staging/app/dist/*.zsync
            apps/desktop/.staging/app/dist/latest*.yml
            apps/desktop/.staging/app/dist/*.blockmap
            apps/desktop/.staging/app/dist/Greeneek-Desktop-latest-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
