name: Desktop release

# One pipeline owns publishing. A tag builds both platforms, then a single
# assemble job proves the checksums and provenance, and one publish job creates
# the GitHub Release. Two rules keep a bad build from shipping:
#
#   1. the release commit must already carry a successful, complete `CI`
#      workflow run (not just a check run that happens to be named `ci`), and
#   2. both platform trees must boot from their unpacked artifact before the
#      release set is assembled.
#
# A manual dispatch with `dry_run` runs the same gates and uploads the verified
# asset set without creating or updating a Release.

on:
  push:
    tags:
      - 'desktop-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing desktop-v* tag to build'
        required: true
        type: string
      dry_run:
        description: 'Build and verify without creating or updating a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate on complete CI for the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Resolve and validate the release tag
        id: resolve
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ref="$REQUESTED_REF"
          if [[ ! "$ref" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a desktop release tag: $ref" >&2
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          # The tag must still point at the checked-out commit. Tags are never
          # moved or deleted: a published tag names bytes users installed.
          if ! tag_sha=$(git rev-parse "$ref^{commit}" 2>/dev/null); then
            echo "::error::release tag does not resolve: $ref" >&2
            exit 1
          fi
          if [ "$tag_sha" != "$sha" ]; then
            echo "::error::$ref points at $tag_sha, not the checked-out $sha" >&2
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "version=${ref#desktop-v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
      - name: Require a successful complete CI workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100")
            green=$(jq --arg sha "$SHA" '
              [.workflow_runs[]
               | select(.head_sha == $sha
                        and .event == "push"
                        and .status == "completed"
                        and .conclusion == "success")]
              | length' <<<"$runs")
            if [ "$green" -gt 0 ]; then
              url=$(jq -r --arg sha "$SHA" '
                [.workflow_runs[]
                 | select(.head_sha == $sha
                          and .event == "push"
                          and .status == "completed"
                          and .conclusion == "success")][0].html_url' <<<"$runs")
              echo "Complete CI workflow is green on $SHA: $url"
              exit 0
            fi
            pending=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$pending" -gt 0 ]; then
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::timed out waiting for a CI workflow run on $SHA" >&2
                exit 1
              fi
              echo "$pending CI workflow run(s) still pending on $SHA; waiting 30s"
              sleep 30
              continue
            fi
            echo "::error::no successful push CI workflow run exists for $SHA; push the release commit to main first" >&2
            jq -r '.workflow_runs[] | "  \(.event) \(.status)/\(.conclusion // "none") \(.html_url)"' <<<"$runs" >&2
            exit 1
          done
      - name: Require no failed CI check run on the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          report=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100")
          failed=$(jq '
            [.check_runs[]
             | select(.name | test("^ci( \\(|$)"))
             | select(.status == "completed"
                      and .conclusion != "success"
                      and .conclusion != "skipped"
                      and .conclusion != "neutral")]
            | length' <<<"$report")
          if [ "$failed" -gt 0 ]; then
            echo "::error::CI reported failed check runs on $SHA" >&2
            jq -r '.check_runs[]
              | select(.name | test("^ci( \\(|$)"))
              | select(.status == "completed"
                       and .conclusion != "success"
                       and .conclusion != "skipped"
                       and .conclusion != "neutral")
              | "  \(.name): \(.conclusion)"' <<<"$report" >&2
            exit 1
          fi

  linux:
    name: Linux x64
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib:host
      - run: pnpm build:lib:client
      - run: pnpm build:web
      - run: node apps/desktop/scripts/stamp-version.mjs "${{ needs.gate.outputs.ref }}"
      # Tags before desktop-v0.3.5 did not run `stage.mjs` inside `dist:*`; the
      # old two-workflow pipeline staged in its own step. A dispatched release
      # builds the tag's own tree, so stage here when that tree's dist scripts
      # do not. Newer trees stage themselves and skip this.
      - name: Stage the desktop app when the tag tree does not
        shell: bash
        run: |
          if [ ! -f apps/desktop/.staging/app/package.json ]; then
            pnpm --filter @greeneek/desktop run stage
          fi
      - run: pnpm --filter @greeneek/desktop run dist:linux
      - name: Boot the unpacked Linux tree
        run: node apps/desktop/scripts/smoke-installed.mjs --app-dir apps/desktop/.staging/app/dist/linux-unpacked/resources/app
      - name: Drop builder diagnostics from the release set
        run: rm -f apps/desktop/.staging/app/dist/builder-debug.yml apps/desktop/.staging/app/dist/builder-effective-config.yaml
      - name: Build AppImage zsync metadata
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zsync
          DIST=apps/desktop/.staging/app/dist
          APPIMAGE=$(ls "$DIST"/Greeneek-Desktop-*-linux-x86_64.AppImage | head -1)
          FILE=$(basename "$APPIMAGE")
          URL="https://github.com/${{ github.repository }}/releases/download/${{ needs.gate.outputs.ref }}/$FILE"
          zsyncmake -u "$URL" -o "$DIST/$FILE.zsync" "$APPIMAGE"
          ls "$DIST"/*.zsync
      - name: Prepare stable download aliases
        run: node apps/desktop/scripts/prepare-release-assets.mjs --dist apps/desktop/.staging/app/dist --tag "${{ needs.gate.outputs.ref }}"
      - name: Assert updater channel files
        shell: bash
        run: |
          ls apps/desktop/.staging/app/dist/latest*.yml
          ls apps/desktop/.staging/app/dist/*.AppImage
          ls apps/desktop/.staging/app/dist/*.zsync
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-desktop-artifacts
          path: |
            apps/desktop/.staging/app/dist/*.deb
            apps/desktop/.staging/app/dist/*.AppImage
            apps/desktop/.staging/app/dist/*.zsync
            apps/desktop/.staging/app/dist/latest*.yml
            apps/desktop/.staging/app/dist/*.blockmap
            apps/desktop/.staging/app/dist/Greeneek-Desktop-latest-*
          retention-days: 14

  windows:
    name: Windows x64
    needs: gate
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib:host
      - run: pnpm build:lib:client
      - run: pnpm build:web
      - name: Smoke Craft discovery and serve against the installed ArtCraft suite
        if: ${{ vars.ARTCRAFT_SMOKE == 'true' }}
        run: |
          pnpm --filter @greeneek/gnk-craft-local run smoke:discovery
          pnpm --filter @greeneek/gnk-craft-local run smoke:serve
      - run: node apps/desktop/scripts/stamp-version.mjs "${{ needs.gate.outputs.ref }}"
      # See the linux job: pre-desktop-v0.3.5 trees need staging before dist.
      - name: Stage the desktop app when the tag tree does not
        shell: pwsh
        run: |
          if (-not (Test-Path apps/desktop/.staging/app/package.json)) {
            pnpm --filter @greeneek/desktop run stage
          }
      - run: pnpm --filter @greeneek/desktop run dist:win
      - name: Boot the unpacked Windows tree
        shell: pwsh
        run: node apps/desktop/scripts/smoke-installed.mjs --app-dir apps/desktop/.staging/app/dist/win-unpacked/resources/app
      - name: Drop builder diagnostics from the release set
        shell: pwsh
        run: |
          Remove-Item -Force apps/desktop/.staging/app/dist/builder-debug.yml, apps/desktop/.staging/app/dist/builder-effective-config.yaml -ErrorAction SilentlyContinue
      - name: Prepare stable download aliases
        shell: pwsh
        run: node apps/desktop/scripts/prepare-release-assets.mjs --dist apps/desktop/.staging/app/dist --tag "${{ needs.gate.outputs.ref }}"
      - name: Assert updater channel files
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/.staging/app/dist/latest*.yml
          Get-ChildItem apps/desktop/.staging/app/dist/*.exe
          Get-ChildItem apps/desktop/.staging/app/dist/*.zip
          Get-ChildItem apps/desktop/.staging/app/dist/*.blockmap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-desktop-artifacts
          path: |
            apps/desktop/.staging/app/dist/*.exe
            apps/desktop/.staging/app/dist/*.zip
            apps/desktop/.staging/app/dist/*.yml
            apps/desktop/.staging/app/dist/*.blockmap
            apps/desktop/.staging/app/dist/Greeneek-Desktop-latest-*
          retention-days: 14

  assemble:
    name: Assemble checksums and release manifest
    needs: [gate, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-desktop-artifacts'
          path: release-assets
          merge-multiple: true
      - name: Write SHA256SUMS and release-manifest.json
        run: node apps/desktop/scripts/release-manifest.mjs --root release-assets --tag "${{ needs.gate.outputs.ref }}" --sha "${{ needs.gate.outputs.sha }}"
      - name: Verify every checksum before publishing
        run: node apps/desktop/scripts/release-manifest.mjs --root release-assets --verify
      - name: Summarize the release set
        run: |
          {
            echo "### Desktop release ${{ needs.gate.outputs.ref }}"
            echo ""
            echo "- commit: \`${{ needs.gate.outputs.sha }}\`"
            echo "- dry run: \`${{ inputs.dry_run == true }}\`"
            echo ""
            echo '```'
            cat release-assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-release-assets
          path: release-assets/**
          retention-days: 14

  publish:
    name: Publish one GitHub Release
    needs: [gate, assemble]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-release-assets
          path: release-assets
      - name: Verify the downloaded release set
        run: node apps/desktop/scripts/release-manifest.mjs --root release-assets --verify
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.gate.outputs.ref }}
          name: ${{ needs.gate.outputs.ref }}
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
