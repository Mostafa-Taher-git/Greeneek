name: Verify consumers

# Temporary, manually-triggered probe: runs the consumer-lane aggregate
# (`check:ci:consumers`) on the same ubuntu-latest runner CI uses, so the
# release verification matrix can be adopted into ci.yml from evidence rather
# than from a guess. Delete once the lane is part of CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Consumer lane aggregate
        run: pnpm run check:ci:consumers
        env:
          CI: true
          GNK_SNAPSHOT: replay
