name: Verify lanes

# Temporary, manually-triggered probe: runs each consumer lane that was measured
# red on ubuntu-latest as its own step with continue-on-error, so one run reports
# every lane's current state instead of stopping at the first failure. Delete
# once the lanes are gated in ci.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lane expected-output
        id: expected
        continue-on-error: true
        run: pnpm run test:expected
        env:
          GNK_SNAPSHOT: replay
      - name: Lane web-browser-snapshot
        id: web
        continue-on-error: true
        run: GNK_SNAPSHOT=replay pnpm run test:web:built
      - name: Lane doc-typecheck
        id: doctc
        continue-on-error: true
        run: pnpm run doc-typecheck:contracts-ready
        env:
          GNK_DOC_TYPECHECK_USE_BUILD_OUTPUT: '1'
      - name: Lane built-bin-smoke
        id: builtbin
        continue-on-error: true
        run: pnpm exec vitest run --config vitest.e2e.config.ts apps/cli/tests/profiles/headless/tests/keyless-smoke.e2e.ts apps/cli/tests/built-bin.e2e.ts packages/host/directory-picker-native/tests/built-worker.e2e.ts packages/sdk/server/tests/built-scope-carrier.e2e.ts packages/subagent/subagent-codex/tests/loader-composition.e2e.ts packages/subagent/subagent-claude-code/tests/loader-composition.e2e.ts packages/api/remotes/tests/built-lib.e2e.ts packages/subagent/agent-team/tests/built-lib.e2e.ts packages/workflow/workflow-worker-thread/tests/built-worker.e2e.ts packages/code-runtime/code-runtime-worker-thread/tests/built-lib.e2e.ts packages/lsp/lsp-stdio/tests/built-lib.e2e.ts
      - name: Report lane outcomes
        if: always()
        run: |
          {
            echo "| lane | outcome |"
            echo "|---|---|"
            echo "| test:expected | ${{ steps.expected.outcome }} |"
            echo "| test:web:built | ${{ steps.web.outcome }} |"
            echo "| doc-typecheck | ${{ steps.doctc.outcome }} |"
            echo "| built-bin-smoke | ${{ steps.builtbin.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
