# Keyless assembled-request snapshot for native Greeneek image offload. The
# local provider endpoint is supplied by the snapshot test; the real attachment
# store and ACP bridge carry two uploaded images into one model request.
# The base bundle deliberately does not mount the native adapter, so this
# scenario inserts its own row over the local fixture server rather than
# overriding a row that no shipped composition carries.
- insert:
    - id: llm-greeneek
      name: '@greeneek/gnk-llm-greeneek'
      config:
        apiKeyEnv: GNK_SNAPSHOT_API_KEY
        baseURL: !!js process.env.GNK_SNAPSHOT_BASE_URL
        thinking: disabled
        maxRequestFilesBytes: 92
        imageOffloadByteQuantum: 1
        models:
          - id: greeneek-v4-flash-vision-exp
            contextWindow: 32768
            maxTokens: 1024
            inputModalities: [text, image]

- id: acp
  name: '@greeneek/gnk-acp'
  config:
    provider: greeneek-official
    model: greeneek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js process.env.GNK_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Keep answers brief and factual.

- id: attachment-local
  name: '@greeneek/gnk-attachment-local'
