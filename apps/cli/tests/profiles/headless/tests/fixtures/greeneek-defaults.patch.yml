# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    # The headless profile no longer mounts the native adapter by default: a
    # shipped unconfigured route would answer every request with
    # MISSING_ENDPOINT. The snapshot mounts it over the local fixture server.
    - id: llm-greeneek
      name: '@greeneek/gnk-llm-greeneek'
      config:
        baseURL: !!js process.env.GNK_SNAPSHOT_BASE_URL
        thinking: enabled
        reasoningEffort: low
        streamIdleTimeoutMs: 150

- id: agent-loop
  config:
    agents:
      - id: main
        provider: greeneek-official
        model: greeneek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
