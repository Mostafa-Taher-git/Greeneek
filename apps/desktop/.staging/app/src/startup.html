<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greeneek</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        --startup-background: #f4f8f6;
        --startup-glow: rgba(6, 122, 82, 0.1);
        --startup-track: rgba(0, 0, 0, 0.07);
        --startup-indicator: #067a52;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background:
          radial-gradient(circle at 50% 42%, var(--startup-glow), transparent 30%),
          var(--startup-background);
        user-select: none;
      }

      main {
        display: flex;
        align-items: center;
        flex-direction: column;
        text-align: center;
      }

      .mark {
        display: grid;
        place-items: center;
      }

      .mark img {
        width: 72px;
        height: 72px;
      }

      .progress {
        width: 164px;
        height: 3px;
        overflow: hidden;
        margin-top: 24px;
        border-radius: 999px;
        background: var(--startup-track);
      }

      .progress::after {
        width: 52px;
        height: 100%;
        display: block;
        border-radius: inherit;
        background: var(--startup-indicator);
        content: "";
        animation: loading 1.25s ease-in-out infinite;
      }

      @keyframes loading {
        0% {
          transform: translateX(-60px);
        }
        50% {
          transform: translateX(86px);
        }
        100% {
          transform: translateX(172px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          width: 100%;
          animation: none;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --startup-background: rgb(21, 21, 23);
          --startup-glow: rgba(6, 122, 82, 0.22);
          --startup-track: rgba(255, 255, 255, 0.09);
          --startup-indicator: #4caf7d;
        }
      }
    </style>
  </head>
  <body>
    <main data-startup-screen>
      <div class="mark">
        <img src="../assets/logo-splash.png" alt="Greeneek" />
      </div>
      <div class="progress" id="progress" aria-label="正在启动"></div>
    </main>
    <script>
      if (!navigator.language.toLowerCase().startsWith("zh")) {
        document.documentElement.lang = "en";
        document.querySelector("#progress").setAttribute("aria-label", "Starting");
      }
    </script>
  </body>
</html>
