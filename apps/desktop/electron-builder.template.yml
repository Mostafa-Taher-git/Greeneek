# Rendered by scripts/stage.mjs into staging (version stamped from the tag).
appId: com.greeneek.desktop
productName: Greeneek
artifactName: Greeneek-Desktop-__DESKTOP_VERSION__-linux-${arch}.${ext}
asar: false
compression: maximum
npmRebuild: false
detectUpdateChannel: false
afterPack: ./config/after-pack.cjs
electronLanguages:
  - en
  - zh_CN
files:
  - src/**/*
  - config/**/*
  - assets/**/*
  - package.json
  - LICENSE
  - third-party-licenses/**/*
  - '!**/*.map'
  - '!**/test/**'
  - '!**/*.md'
  # No node_modules entry on purpose: the builder's own module scan cannot
  # read this pre-pruned closure, so config/after-pack.cjs grafts it verbatim
  # after the file copy (staging already boots green under smoke).
directories:
  buildResources: assets
win:
  icon: assets/icon.ico
  artifactName: Greeneek-Desktop-__DESKTOP_VERSION__-windows-${arch}.${ext}
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
linux:
  icon: assets/icon.png
  category: Development
  executableName: greeneek
  maintainer: Mostafa-Taher-git
  artifactName: Greeneek-Desktop-__DESKTOP_VERSION__-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
deb:
  compression: gz
publish:
  provider: github
  owner: Mostafa-Taher-git
  repo: Greeneek
  releaseType: release
  publishAutoUpdate: true
