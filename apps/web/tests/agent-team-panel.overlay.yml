# Equivalent to the Host Agent Teams profile layer over the scaffold's stable
# base and Web bundles. `gnk-base` mounts the Team service and `gnk-web-app`
# mounts its browser panel, so this overlay carries only the Team tool.
- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    - id: tool-agent-team
      name: '@greeneek/gnk-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
