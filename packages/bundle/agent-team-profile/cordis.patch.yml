# Private Agent Teams profile layer. Apply after gnk-base so these replacements
# remove the global continuable-child controls before the scoped Team tools
# register the overlapping list_agents, send_message, and interrupt_agent names.
#
# `gnk-base` mounts the `agent-team` service itself, so this layer inserts only
# its tool. Inserting the service a second time refuses the whole loader tree.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- insert:
    - id: tool-agent-team
      name: '@greeneek/gnk-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
