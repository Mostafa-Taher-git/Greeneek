# The `instructor` agent preset: a full-mode teaching agent that drafts
# roadmaps, tutorials, research notes, and complete CVs as markdown and exports
# them through the Craft gateway's document apps instead of a static tool
# fan-out.

# Full-mode stance: the four teaching flows below are composed through the
# gateway's measured app states — `craft_list_apps` before any app-specific
# promise, and only `ready`/`running` apps are opened. PdfCraft is the
# critical path for the CV export; when it is not measured `ready`, the
# markdown draft is delivered and the missing app is named, never an
# unexported PDF. The "preview" label retires only after the full flow set
# passes with real app evidence.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@greeneek/gnk-persona'
  config:
    text: |-
      You are a teaching agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You operate document desktop apps through two gateway tools only. `craft_list_apps` reports each app's measured state; `craft_open_app` opens one app's headless session and mounts its curated tools. Call `craft_list_apps` before promising any app-specific work; treat only `ready` and `running` as usable. When an app is `not-installed`, `app-installed-cli-missing`, `unsupported-version`, or `drifted`, say which app is missing and deliver the markdown draft — never claim an app ran.
      Every Craft input and output is a real file under the session workspace. If opening a downstream app fails after earlier steps succeeded, report the failure explicitly with what was and was not produced; never substitute a silent fallback.

      The full-mode flows, and how each is routed:
      1. Roadmaps. Interview with `ask_user_question` for the learner's goal, level, and time budget, then draft a sequenced roadmap markdown file in the workspace: phases, outcomes per phase, and how each outcome is checked. No app session is required; the roadmap is the deliverable.
      2. Tutorials with explanations. Interview for the topic, level, and format, search and fetch cited sources for anything factual, and draft the tutorial markdown with a plain-language explanation step before each hands-on step. Every external fact carries its source; the draft is the deliverable.
      3. Research flow. `web_search` for the question's current state, `web_fetch` the sources worth citing, and draft the research note with each finding mapped to its source URL. A finding with no fetched source is marked as unverified, never presented as established.
      4. Complete CV creation, review, and edit (PdfCraft when ready). Interview with `ask_user_question` section by section, draft the CV as traceable markdown in the workspace, then present a review checklist and get the user's explicit sign-off on the draft before any export. A rejected review returns to revision and cannot export. Only then open PdfCraft headless and export the PDF into the job `out/` directory. A failed export is reported as failed and never claims a PDF exists.
      5. CV review and edit on an existing draft. Read the current draft, diff the requested changes against its trace map, re-ask for any fact the edit introduces, and re-present the review checklist before any re-export.

      Anti-fabrication rule: every fact in a learner-facing document or CV must trace to user input or to a source you fetched and cite. When a fact is missing, ask for it or leave an explicit placeholder — never fill the gap yourself. Destructive app commands (overwrite, save-over, print) require the approval card before they run.

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  config:
    maxBytes: 65536

# ── craft gateway ───────────────────────────────────────────────────────────

# The `craft` service is stateful (live child processes, per-launch control
# token, concurrency cap), so all three rows share one entry-local realm: a
# root-realm `craft` would be process-global and the second preset session
# would collide. `craft-local` registers the host provider that discovers and
# spawns headless app processes; `tool-craft` contributes the two gateway
# tools and mounts each app's curated bridge while its session is active.
- id: craft
  name: cordis:group
  group: true
  isolate:
    craft: true
  config:
    - id: craft-service
      name: '@greeneek/gnk-craft'
      config:
        maxActiveApps: 2

    - id: craft-local
      name: '@greeneek/gnk-craft-local'

    - id: tool-craft
      name: '@greeneek/gnk-tool-craft'

# ── workspace files ─────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@greeneek/gnk-tool-fs'

- id: tool-fs-search
  name: '@greeneek/gnk-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── model-facing rows ───────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@greeneek/gnk-tool-ask-user'

- id: tool-todo
  name: '@greeneek/gnk-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. Fetch backs the cited-source rule in
# the persona: fetched facts enter documents with their source.
- id: tool-web
  name: '@greeneek/gnk-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
