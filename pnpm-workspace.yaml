packages:
  - vendor/*
  - packages/*/*
  # The Landlock launcher is developed with its harness consumers but keeps
  # its native build and publication scripts under native/landlock-run.
  - native/landlock-run
  - native/landlock-run/packages/*
  # Product assemblies over the package tier; apps/cli owns the `gnk` bin.
  - apps/*
  - website
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - python/sdk-runtime

# Vendored framework packages keep their upstream semver ranges, while local
# builds must resolve those matching names to this workspace's pinned sources.
linkWorkspacePackages: true

# The checkout's node_modules is a local build artifact. `pnpm run` must not
# purge and reinstall the whole workspace merely because its module-state
# stamp is stale after moving or repairing links.
verifyDepsBeforeRun: false

overrides:
  # Single patched Vite line for every transitive consumer (vitest, plugins).
  vite: '8.4.0'
  '@greeneek/cosmokit': 'link:vendor/cosmokit'
  '@greeneek/schemastery': 'link:vendor/schemastery'
  # electron-builder reaches @electron/rebuild, which pins node-gyp to a git
  # commit the exotic-subdep policy rejects. The desktop never runs rebuild
  # (its child is real Node, nothing native compiles), so the registry
  # release satisfies the install without changing any executed code path.
  '@electron/node-gyp': '10.2.0-electron.2'
  # Client packages still declare react/react-dom ^18 ranges (pre-rebrand),
  # while the tree ships and runs 19: pnpm then installs both majors and
  # peer slots split, so component tests die on duplicate-React errors.
  # One pinned copy until the ranges are updated package by package.
  react: '19.2.6'
  react-dom: '19.2.6'
  '@modelcontextprotocol/sdk@>=1.10.0 <1.30.1': ^1.30.1
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': ^1.31.0
